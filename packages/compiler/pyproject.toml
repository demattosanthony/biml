[project]
name = "bim-compiler"
version = "0.1.0"
description = "Compiler for BIM DSL - transforms JSON IR to IFC"
requires-python = ">=3.11"
dependencies = [
    "ifcopenshell>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
bim-compile = "compiler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compiler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
